name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply reviewed terminology fixes
        if: github.ref_name == 'feat/node-destinations' || github.head_ref == 'feat/node-destinations'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(pathname, old, new):
              path = Path(pathname)
              text = path.read_text()
              if old in text:
                  text = text.replace(old, new)
                  path.write_text(text)

          # Keep the Rust command name aligned with the public command.
          replace("src/cli.rs", '    #[command(name = "daemon", alias = "serve")]\n    Serve {', '    #[command(alias = "serve")]\n    Daemon {')
          replace("src/main.rs", "Command::Serve { bind }", "Command::Daemon { bind }")

          # Canonical CLI field names; old spellings remain clap aliases.
          replace("src/cli.rs", "pub receiver_url: Option<String>", "pub peer_url: Option<String>")
          replace("src/main.rs", "cli.receiver_url", "cli.peer_url")
          replace("src/cli.rs", "        receiver_url: String,", "        peer_url: String,")
          replace("src/main.rs", "                receiver_url,\n                bind,", "                peer_url,\n                bind,")
          replace("src/main.rs", "                    receiver_url,\n                    bind,", "                    receiver_url: peer_url,\n                    bind,")

          # Pairing option names describe nodes rather than the old controller/receiver roles.
          replace(
              "src/cli.rs",
              "        /// This node's name stored on the peer.\n        #[arg(long)]\n        device_name: Option<String>,",
              "        /// This node's name stored on the peer.\n        #[arg(long = \"node-name\", alias = \"device-name\")]\n        node_name: Option<String>,",
          )
          replace("src/main.rs", "            device_name,\n            name,", "            node_name,\n            name,")
          replace("src/main.rs", "                device_name,\n                name,", "                node_name,\n                name,")
          replace("src/main.rs", "    device_name: Option<String>,\n    name: Option<String>,", "    node_name: Option<String>,\n    name: Option<String>,")
          replace("src/main.rs", "let local_name = match device_name {", "let local_name = match node_name {")

          # Fix references exposed by the cross-file type rename.
          replace("src/main.rs", "info.receiver_name", "info.node_name")
          replace("src/node.rs", "receiver::run_peer_api", "peer_api::run_peer_api")
          replace("src/peer_api.rs", "oneshot::PlaybackRuntime", "oneshot::Receiver")
          replace("src/peer_api.rs", "before starting the receiver", "before starting the node")
          replace("src/config.rs", "invalid receiver address host", "invalid peer address host")

          # Canonical examples and browser errors use daemon.
          for pathname in [
              "README.md",
              "AGENTS.md",
              "docs/architecture.md",
              "docs/deployment.md",
              "docs/development.md",
              "docs/pairing-auth.md",
              "extension/lib.js",
              "extension/lib.test.js",
              "extension/options.html",
              "extension/options.js",
              "contrib/systemd/ura.service",
              "nix/home-manager-module.nix",
          ]:
              replace(pathname, "ura serve", "ura daemon")
              replace(pathname, "cargo run -- serve", "cargo run -- daemon")
          PY

          cargo fmt
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: complete node terminology migration"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked
      - name: Run Firefox extension tests
        run: node --test extension/lib.test.js

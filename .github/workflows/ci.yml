name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Sync generated Rust files
        if: github.event_name == 'pull_request'
        run: |
          cargo fmt
          cargo check
          if ! git diff --quiet -- src Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src Cargo.lock
            git commit -m "chore: format code and sync Cargo.lock"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Run Rust tests
        run: cargo test
      - name: Run Firefox extension tests
        run: node --test extension/lib.test.js
      - name: Check formatting
        run: cargo fmt --check

name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply reviewed node fixes
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/node.rs")
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, got {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "    Status { status: MpvStatus },",
              "    Status { status: Box<MpvStatus> },",
          )
          replace_once(
              "            NodeResponse::Status { status } => Ok(status),",
              "            NodeResponse::Status { status } => Ok(*status),",
          )
          replace_once(
              "            Ok(NodeResponse::Status { status })",
              "            Ok(NodeResponse::Status { status: Box::new(status) })",
          )

          replace_once(
              "    migrate_legacy_peer(&mut config);\n    if config.devices.iter().any(|device| device.name == name) {",
              "    let migrated_legacy_peer = migrate_legacy_peer(&mut config);\n    if config.devices.iter().any(|device| device.name == name) {",
          )
          replace_once(
              "    persist_device_config(config_path_override, &config)\n}\n\npub fn add_paired_peer",
              "    persist_device_config(config_path_override, &config, migrated_legacy_peer)\n}\n\npub fn add_paired_peer",
          )
          replace_once(
              "    migrate_legacy_peer(&mut config);\n    if config.devices.iter().any(|device| device.name == peer_name) {",
              "    let migrated_legacy_peer = migrate_legacy_peer(&mut config);\n    if config.devices.iter().any(|device| device.name == peer_name) {",
          )
          replace_once(
              "    persist_device_config(config_path_override, &config)\n}\n\npub fn remove_peer",
              "    persist_device_config(config_path_override, &config, migrated_legacy_peer)\n}\n\npub fn remove_peer",
          )
          replace_once(
              "    persist_device_config(config_path_override, &config)\n}\n\npub fn select_device",
              "    persist_device_config(config_path_override, &config, false)\n}\n\npub fn select_device",
          )

          old_select_migration = '''    if config.devices.is_empty()
              && config
                  .legacy_device
                  .as_ref()
                  .is_some_and(|legacy| !is_loopback_receiver_url(&legacy.url))
              {
                  migrate_legacy_peer(&mut config);
              }

              if selecting_self {
          '''
          new_select_migration = '''    let migrated_legacy_peer = if config.devices.is_empty()
              && config
                  .legacy_device
                  .as_ref()
                  .is_some_and(|legacy| !is_loopback_receiver_url(&legacy.url))
              {
                  migrate_legacy_peer(&mut config)
              } else {
                  false
              };

              if selecting_self {
          '''
          replace_once(old_select_migration, new_select_migration)

          select_persist = "persist_device_config(config_path_override, &config)?;"
          if text.count(select_persist) != 2:
              raise SystemExit(f"expected two select persistence calls, got {text.count(select_persist)}")
          text = text.replace(
              select_persist,
              "persist_device_config(config_path_override, &config, migrated_legacy_peer)?;",
          )

          old_migrate = '''fn migrate_legacy_peer(config: &mut DeviceConfig) {
              if !config.devices.is_empty() {
                  return;
              }
              if let Some(legacy) = &config.legacy_device
                  && !is_loopback_receiver_url(&legacy.url)
              {
                  config.devices.push(legacy.clone());
              }
          }
          '''
          new_migrate = '''fn migrate_legacy_peer(config: &mut DeviceConfig) -> bool {
              if !config.devices.is_empty() {
                  return false;
              }
              if let Some(legacy) = &config.legacy_device
                  && !is_loopback_receiver_url(&legacy.url)
              {
                  config.devices.push(legacy.clone());
                  return true;
              }
              false
          }
          '''
          replace_once(old_migrate, new_migrate)

          replace_once(
              "fn persist_device_config(config_path_override: Option<&Path>, config: &DeviceConfig) -> Result<()> {",
              '''fn persist_device_config(
              config_path_override: Option<&Path>,
              config: &DeviceConfig,
              clear_legacy_receiver_url: bool,
          ) -> Result<()> {''',
          )
          replace_once(
              '''    let table = root
                  .as_table_mut()
                  .ok_or_else(|| anyhow::anyhow!("config root must be a TOML table"))?;

              match &config.selected_device {''',
              '''    let table = root
                  .as_table_mut()
                  .ok_or_else(|| anyhow::anyhow!("config root must be a TOML table"))?;

              if clear_legacy_receiver_url {
                  table.remove("receiver_url");
              }

              match &config.selected_device {''',
          )

          test = r'''

              #[test]
              fn migrated_legacy_peer_does_not_reappear_after_removal() {
                  let path = unique_path("legacy-remove");
                  fs::write(
                      &path,
                      r#"
          receiver_url = "http://192.168.1.10:8765"
          token = "legacy-token"
          "#,
                  )
                  .expect("write config");

                  let selected = select_device(Some(&path), "legacy").expect("select legacy peer");
                  assert_eq!(selected, "legacy");
                  remove_peer(Some(&path), "legacy").expect("remove migrated legacy peer");

                  let devices = device_set(Some(&path)).expect("list devices");
                  assert_eq!(devices.devices.len(), 1);
                  assert_eq!(devices.devices[0].kind, DeviceKind::ThisDevice);

                  let value: toml::Value = toml::from_str(
                      &fs::read_to_string(&path).expect("read config"),
                  )
                  .expect("parse config");
                  assert!(
                      value
                          .as_table()
                          .expect("config table")
                          .get("receiver_url")
                          .is_none()
                  );
                  let _ = fs::remove_file(path);
              }
          '''
          end = text.rfind("\n}\n")
          if end == -1:
              raise SystemExit("could not find test module closing brace")
          text = text[:end] + test + text[end:]

          path.write_text(text)
          PY
          cargo fmt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/node.rs
          git commit -m "fix: preserve legacy peer removal and box status response"
          git push origin HEAD:${{ github.head_ref }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked
      - name: Run Firefox extension tests
        run: node --test extension/lib.test.js

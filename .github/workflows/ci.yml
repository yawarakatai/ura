name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run Rust tests
        run: cargo test
      - name: Run Firefox extension tests
        run: node --test extension/lib.test.js
      - name: Check formatting
        run: cargo fmt --check

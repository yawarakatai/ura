name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply terminology migration
        if: github.ref_name == 'feat/node-destinations' || github.head_ref == 'feat/node-destinations'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def replace_identifier(path, old, new):
              text = path.read_text()
              text = re.sub(rf"\b{re.escape(old)}\b", new, text)
              path.write_text(text)

          receiver = Path("src/receiver.rs")
          peer_api = Path("src/peer_api.rs")
          if receiver.exists() and not peer_api.exists():
              subprocess.run(["git", "mv", str(receiver), str(peer_api)], check=True)

          # Core Rust names: node owns playback; remote nodes are peers.
          rust_files = list(Path("src").glob("*.rs"))
          for old, new in [
              ("RemoteDevice", "Peer"),
              ("ReceiverConfig", "NodeConfig"),
              ("HttpClient", "PeerClient"),
              ("PairingHttpClient", "PeerPairingClient"),
              ("ReceiverBase", "PeerBase"),
              ("normalize_receiver_address", "normalize_peer_address"),
              ("validate_receiver_token", "validate_peer_token"),
              ("run_serve", "run_peer_api"),
          ]:
              for path in rust_files:
                  replace_identifier(path, old, new)

          # Module name describes the peer-facing transport instead of an app role.
          for path in rust_files:
              text = path.read_text()
              text = text.replace("crate::receiver", "crate::peer_api")
              text = text.replace("pub mod receiver;", "pub mod peer_api;")
              path.write_text(text)

          # The peer API owns mpv locally; it is not a Receiver role.
          path = Path("src/peer_api.rs")
          text = path.read_text()
          text = re.sub(r"\bReceiver\b", "PlaybackRuntime", text)
          text = text.replace("let receiver = PlaybackRuntime::start", "let playback = PlaybackRuntime::start")
          text = text.replace("receiver.into_parts()", "playback.into_parts()")
          text = text.replace('"receiver startup"', '"peer API startup"')
          text = text.replace('"receiver shutdown"', '"peer API shutdown"')
          text = text.replace('"HTTP receiver bind address"', '"peer API bind address"')
          text = text.replace('"HTTP receiver listening"', '"peer API listening"')
          text = text.replace('"HTTP receiver failed"', '"peer API failed"')
          text = text.replace('"HTTP receiver"', '"peer API"')
          text = text.replace("failed to bind HTTP receiver", "failed to bind peer API")
          text = text.replace("receiver token", "peer API token")
          text = text.replace("existing receiver", "existing node")
          text = text.replace("receiver process task should exist", "playback process task should exist")
          path.write_text(text)

          # Node supervision uses peer API terminology.
          path = Path("src/node.rs")
          text = path.read_text()
          text = re.sub(r"\breceiver_task\b", "peer_api_task", text)
          text = re.sub(r"\bwait_for_receiver\b", "wait_for_peer_api", text)
          text = text.replace('"receiver"', '"peer API"')
          text = text.replace("receiver task failed", "peer API task failed")
          text = text.replace("receiver exited during node startup", "peer API exited during node startup")
          text = text.replace("local ura receiver", "local ura peer API")
          path.write_text(text)

          # Pairing state uses node_name internally. Pairing protocol v1 HTTP JSON
          # continues to serialize `receiver_name` for compatibility.
          path = Path("src/pairing.rs")
          text = re.sub(r"\breceiver_name\b", "node_name", path.read_text())
          path.write_text(text)

          path = Path("src/client.rs")
          text = path.read_text()
          text = text.replace("pub receiver_name: String,", '#[serde(rename = "receiver_name")]\n    pub node_name: String,')
          text = text.replace(".receiver_name", ".node_name")
          text = text.replace("failed to connect to receiver", "failed to connect to peer")
          text = text.replace("HTTP request to receiver", "HTTP request to peer")
          text = text.replace("HTTP response from receiver", "HTTP response from peer")
          text = text.replace("receiver did not return", "peer did not return")
          text = text.replace("receiver returned HTTP", "peer returned HTTP")
          text = text.replace("receiver JSON response", "peer JSON response")
          path.write_text(text)

          path = Path("src/peer_api.rs")
          text = path.read_text()
          text = text.replace(
              "struct PairInfoResponse {\n    pairing: bool,\n    receiver_name: String,",
              'struct PairInfoResponse {\n    pairing: bool,\n    #[serde(rename = "receiver_name")]\n    node_name: String,',
          )
          text = text.replace(
              "struct PairClaimResponse {\n    protocol_version: u8,\n    receiver_name: String,",
              'struct PairClaimResponse {\n    protocol_version: u8,\n    #[serde(rename = "receiver_name")]\n    node_name: String,',
          )
          text = text.replace("PairingStatus::Active {\n            receiver_name,", "PairingStatus::Active {\n            node_name,")
          text = text.replace("            receiver_name,\n            expires_in,", "            node_name,\n            expires_in,")
          text = text.replace("let receiver_name = match state.pairing.status().await", "let node_name = match state.pairing.status().await")
          text = text.replace("PairingStatus::Active { receiver_name, .. } => receiver_name", "PairingStatus::Active { node_name, .. } => node_name")
          text = text.replace("        receiver_name,\n        token,", "        node_name,\n        token,")
          path.write_text(text)

          # Local browser API is new in 0.3, so expose node_name directly.
          path = Path("src/local_api.rs")
          text = path.read_text()
          text = text.replace("receiver_url", "peer_url")
          text = text.replace("receiver_name", "node_name")
          text = text.replace("claim.node_name || info.node_name", "claim.node_name || info.node_name")
          path.write_text(text)

          # Canonical env var is URA_PEER_URL; the old one remains a fallback.
          path = Path("src/config.rs")
          text = path.read_text()
          text = text.replace("fn env_receiver_url() -> Option<String> {\n    env::var(\"URA_RECEIVER_URL\").ok()\n}", "fn env_receiver_url() -> Option<String> {\n    env::var(\"URA_PEER_URL\")\n        .ok()\n        .or_else(|| env::var(\"URA_RECEIVER_URL\").ok())\n}")
          path.write_text(text)

          # Firefox consumes the new local API node_name but legacy peer HTTP
          # compatibility stays confined to Rust's peer protocol implementation.
          path = Path("extension/lib.js")
          text = path.read_text()
          text = text.replace("claim.receiver_name || info.receiver_name", "claim.node_name || info.node_name")
          text = text.replace("`ura serve`", "`ura daemon`")
          path.write_text(text)

          path = Path("extension/lib.test.js")
          text = path.read_text()
          text = text.replace("receiver_name: \"kamo\"", "node_name: \"kamo\"")
          text = text.replace("Start `ura serve`", "Start `ura daemon`")
          path.write_text(text)

          # User-visible docs and service examples use daemon/node/peer/client.
          for filename in [
              "README.md",
              "AGENTS.md",
              "docs/architecture.md",
              "docs/deployment.md",
              "docs/development.md",
              "docs/pairing-auth.md",
              "extension/options.html",
              "extension/options.js",
              "contrib/systemd/ura.service",
              "nix/home-manager-module.nix",
          ]:
              path = Path(filename)
              text = path.read_text()
              text = text.replace("ura serve", "ura daemon")
              text = text.replace("Authorized controllers", "Authorized clients")
              text = text.replace("authorized controllers", "authorized clients")
              text = text.replace("controller credential", "client credential")
              text = text.replace("controller token", "client token")
              text = text.replace("receiver process", "node daemon")
              text = text.replace("receiver service", "node service")
              text = text.replace("receiver API", "peer API")
              text = text.replace("Receiver API", "Peer API")
              path.write_text(text)
          PY

          cargo fmt
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "refactor: adopt node and peer terminology"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked
      - name: Run Firefox extension tests
        run: node --test extension/lib.test.js

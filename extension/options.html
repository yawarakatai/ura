<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ura settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <form id="pairing-form">
        <h1>Connect Firefox to ura</h1>
        <p>
          Start the local ura node, run <code>ura pair</code>, then enter the six-digit code here.
        </p>

        <label>
          Pairing code
          <input id="pairing-code" name="pairingCode" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
        </label>

        <label>
          Browser name
          <input id="local-device-name" name="localDeviceName" type="text" required>
        </label>

        <label>
          Default action
          <select id="default-action" name="defaultAction">
            <option value="play">Play</option>
            <option value="queue">Queue</option>
          </select>
        </label>

        <button type="submit">Connect</button>
        <p id="status" role="status"></p>
      </form>

      <section id="devices-section">
        <h2>Playback device</h2>
        <p id="selected-device"></p>
        <div id="devices"></div>
        <p>
          Pair and remove remote ura nodes from the CLI. Device selection here is shared with
          <code>ura device select</code>.
        </p>
      </section>
    </main>
    <script src="lib.js"></script>
    <script src="options.js"></script>
  </body>
</html>

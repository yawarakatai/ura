<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ura settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <form id="pairing-form">
        <label>
          Receiver address
          <input id="receiver-address" name="receiverAddress" type="text" required>
        </label>

        <label>
          Pairing code
          <input id="pairing-code" name="pairingCode" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
        </label>

        <label>
          Receiver name
          <input id="receiver-name" name="receiverName" type="text" required>
        </label>

        <label>
          This device name
          <input id="local-device-name" name="localDeviceName" type="text" required>
        </label>

        <label>
          Default action
          <select id="default-action" name="defaultAction">
            <option value="play">Play</option>
            <option value="queue">Queue</option>
          </select>
        </label>

        <button type="submit">Pair</button>
        <p id="status" role="status"></p>
      </form>

      <section id="devices-section">
        <h2>Devices</h2>
        <p id="selected-device"></p>
        <div id="devices"></div>
      </section>
    </main>
    <script src="lib.js"></script>
    <script src="options.js"></script>
  </body>
</html>
